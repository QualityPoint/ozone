<!-- Ozone's dual-tone module icons for the desk dock, sidebars and headers. Each symbol animates
     while its dock tile is hovered, through the icon-motion custom properties the tile sets
     (frappe/public/scss/desk/dock.scss): `icon-motion` (paused | running) and
     `icon-motion-opacity` (0 | 1).

     A name must end in `-duotone` for the dock to draw it on the 24px grid with the tile's tones.
     Every id, class and custom property is prefixed `ozone-` so nothing clashes with another app's
     sprite.

     This sprite is inserted into the page, so the style block below is a document stylesheet. -->

<svg id="ozone-module-symbols" aria-hidden="true" style="display: none;" class="icon" xmlns="http://www.w3.org/2000/svg">
	<style>
		/* The Ozone colours, from the logo: a green body (the Z) and a red detail (the O).
		   light-dark() picks per theme; the dark theme uses a deep body and a light detail so the
		   pair reads on a dark tray.
		     rest     light: #a9cdb5 / #ae2423     dark: #1f6038 / #ef6b68
		     active   light: #8fbe9f / #8c1d1c     dark: #287a49 / #f28684 */
		:root {
			--ozone-body: light-dark(#a9cdb5, #1f6038);
			--ozone-detail: light-dark(#ae2423, #ef6b68);
			--ozone-body-active: light-dark(#8fbe9f, #287a49);
			--ozone-detail-active: light-dark(#8c1d1c, #f28684);
		}
		/* Frappe's sprite sets grey tones on every duotone tile and header. These win for Ozone's
		   icons only, through the symbol the tile holds, so other apps keep their own. */
		.dock-item--duotone:has(use[href^="#icon-ozone-"]),
		.shell-header:hover .header-logo:has(use[href^="#icon-ozone-"]),
		.shell-header.hover .header-logo:has(use[href^="#icon-ozone-"]) {
			--duotone-light: var(--ozone-body);
			--duotone-dark: var(--ozone-detail);
		}
		.dock-item--duotone.active:has(use[href^="#icon-ozone-"]) {
			--duotone-light: var(--ozone-body-active);
			--duotone-dark: var(--ozone-detail-active);
		}

		/* Home: the front door swings open on its left hinge. */
		.ozone-door {
			transform-box: fill-box;
			transform-origin: left center;
			transform: scaleX(calc(1 - 0.7 * var(--icon-motion-opacity, 0)));
			transition: transform 0.3s ease;
		}
		/* Pop: dots, days and tiles pop in one after another. */
		.ozone-pop {
			transform-box: fill-box;
			transform-origin: center;
			animation: ozone-pop 1.8s ease-out infinite;
			animation-play-state: var(--icon-motion, paused);
		}
		.ozone-pop:nth-child(2) { animation-delay: 0.15s; }
		.ozone-pop:nth-child(3) { animation-delay: 0.3s; }
		.ozone-pop:nth-child(4) { animation-delay: 0.45s; }
		.ozone-pop:nth-child(5) { animation-delay: 0.6s; }
		.ozone-pop:nth-child(6) { animation-delay: 0.75s; }
		@keyframes ozone-pop {
			0%, 45%, 100% { transform: scale(1); }
			10% { transform: scale(0.3); }
			25% { transform: scale(1.15); }
		}
		/* Settings: the gear turns. */
		.ozone-gear {
			transform-box: view-box;
			transform-origin: 12px 12px;
			animation: ozone-turn 4s linear infinite;
			animation-play-state: var(--icon-motion, paused);
		}
		@keyframes ozone-turn { to { transform: rotate(360deg); } }
	</style>

	<!-- Home: a house with a door. -->
	<symbol viewBox="0 0 24 24" id="icon-ozone-home-duotone" stroke="none" style="overflow: visible">
		<path d="M4.5 10.2 12 4.3l7.5 5.9V20a1.5 1.5 0 0 1-1.5 1.5H6A1.5 1.5 0 0 1 4.5 20z" style="fill: var(--duotone-light, var(--ozone-body))" />
		<path d="M2.6 11 12 3.3l9.4 7.7" style="fill: none; stroke: var(--duotone-dark, var(--ozone-detail)); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round" />
		<rect class="ozone-door" x="9.8" y="14" width="4.4" height="7.5" rx="1" style="fill: var(--duotone-dark, var(--ozone-detail))" />
	</symbol>




	<!-- Website: a browser window whose blocks lay themselves out. -->
	<symbol viewBox="0 0 24 24" id="icon-ozone-browser-duotone" stroke="none" style="overflow: visible">
		<rect x="2.5" y="3.5" width="19" height="17" rx="2.2" style="fill: var(--duotone-light, var(--ozone-body))" /><path d="M2.5 8.2V5.7a2.2 2.2 0 0 1 2.2-2.2h14.6a2.2 2.2 0 0 1 2.2 2.2v2.5z" style="fill: var(--duotone-dark, var(--ozone-detail))" /><g style="fill: var(--duotone-dark, var(--ozone-detail))"><rect class="ozone-pop" x="5" y="10.4" width="6.4" height="7.6" rx="1" /><rect class="ozone-pop" x="12.8" y="10.4" width="6.2" height="3.2" rx="0.8" /><rect class="ozone-pop" x="12.8" y="14.8" width="6.2" height="3.2" rx="0.8" /></g>
	</symbol>

	<!-- Settings: a gear. -->
	<symbol viewBox="0 0 24 24" id="icon-ozone-settings-duotone" stroke="none" style="overflow: visible">
		<g class="ozone-gear"><g style="fill: var(--duotone-light, var(--ozone-body))"><circle cx="12" cy="12" r="6.6" /><rect x="10.4" y="2.4" width="3.2" height="3.6" rx="0.5" /><rect x="10.4" y="2.4" width="3.2" height="3.6" rx="0.5" transform="rotate(45 12 12)" /><rect x="10.4" y="2.4" width="3.2" height="3.6" rx="0.5" transform="rotate(90 12 12)" /><rect x="10.4" y="2.4" width="3.2" height="3.6" rx="0.5" transform="rotate(135 12 12)" /><rect x="10.4" y="2.4" width="3.2" height="3.6" rx="0.5" transform="rotate(180 12 12)" /><rect x="10.4" y="2.4" width="3.2" height="3.6" rx="0.5" transform="rotate(225 12 12)" /><rect x="10.4" y="2.4" width="3.2" height="3.6" rx="0.5" transform="rotate(270 12 12)" /><rect x="10.4" y="2.4" width="3.2" height="3.6" rx="0.5" transform="rotate(315 12 12)" /></g></g><circle cx="12" cy="12" r="2.8" style="fill: var(--duotone-dark, var(--ozone-detail))" />
	</symbol>
</svg>
